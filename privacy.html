<h1>Datenschutz</h1>
<p>Diese App (private rclone-Instanz) wird ausschließlich vom Betreiber selbst genutzt, um eigene Dateien
zwischen lokalem Rechner und eigenem Google Drive zu synchronisieren.
Es werden keine Daten an Dritte weitergegeben oder auf fremden Servern gespeichert.</p>
